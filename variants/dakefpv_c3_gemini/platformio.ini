; DAKEFPV C3 900/2400 Dual Band 100mW Gemini RX - an ExpressLRS receiver.
;
;   ESP32-C3, 4 MB flash, two LR1121 radios for receive diversity. MeshCore
;   drives one radio; the second is left unclaimed.
;
; Pin values are from the ExpressLRS hardware layout for this target -
; ExpressLRS target "DAKEFPV C3 900/2400 Dual Band 100mW Gemini RX", firmware
; Unified_ESP32C3_LR1121_RX, layout "Generic C3 LR1121 True Diversity.json" -
; read back out of this module's own flash.
;
; Unused from that layout: serial_rx/serial_tx (GPIO20/21, the CRSF link to the
; flight controller - these are also the C3's default UART0 pins, which is why
; the console works over them) and the second radio's pins.

[DAKEFPV_C3_Gemini]
extends = esp32_base
board = esp32-c3-devkitm-1
; The 1536k table is too small here: the linked size PlatformIO reports is not
; the size of the .bin it writes - padding and the post-build trailer added
; ~122 KB, which overran app0 into app1 and left the bootloader silently
; rebooting. 4 MB dual-OTA gives 0x1F0000 slots with room to spare.
board_build.partitions = variants/dual_ota_full_4MB.csv
; No auto-reset wiring on this receiver: DTR is not tied to the GPIO9 boot
; strap, so download mode needs the button held while power is applied.
; RTS-to-EN is not wired either, hence no_reset on both ends.
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset
build_flags =
  ${esp32_base.build_flags}
  -I variants/dakefpv_c3_gemini
  -D DAKEFPV_C3_GEMINI

  ; ---- radio ----
  -D RADIO_CLASS=CustomLR1121
  -D WRAPPER_CLASS=CustomLR1121Wrapper
  -D USE_LR1121
  ; Core spells the LR11x0 family gate USE_LR1110 - it selects the family's
  ; 62.5/125/250/500 kHz bandwidth set and the RX-boosted-gain default, both of
  ; which apply to the LR1121. Define it too until that gate gets a family name.
  -D USE_LR1110
  -D P_LORA_SCLK=6
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=4
  -D P_LORA_NSS=0
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=3
  -D P_LORA_DIO_1=1

  ; ---- clocking ----
  ; Crystal, not TCXO. The layout declares no radio_tcxo, so ExpressLRS never
  ; issues SET_TCXO_MODE. Zero is stated explicitly because omitting it would
  ; let target.cpp fall back to a voltage; see the note there.
  -D LR11X0_DIO3_TCXO_VOLTAGE=0

  ; ---- frequency ----
  ; The options blob had "domain": 1 = FCC915, so this is a US 915 MHz unit.
  -D LORA_FREQ=910.525

  ; ---- TX power ----
  ; Layout power_values are [14, 18, 20, 22] dBm at power_control 0, i.e. fed
  ; straight to the radio. 22 dBm is the top step and the vendor default.
  -D LORA_TX_POWER=22
  -D MIN_LORA_TX_POWER=-9
  -D MAX_LORA_TX_POWER=22

  ; ---- board ----
  ; WS2812 on GPIO19, GRB, which is what neopixelWrite() emits.
  -D P_LORA_TX_NEOPIXEL_LED=19
  -D PIN_USER_BTN=9

build_unflags =
  -D LORA_FREQ=869.618
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/dakefpv_c3_gemini>
lib_deps =
  ${esp32_base.lib_deps}

[env:DAKEFPV_C3_Gemini_repeater]
extends = DAKEFPV_C3_Gemini
build_flags =
  ${DAKEFPV_C3_Gemini.build_flags}
  -D ADVERT_NAME='"DAKEFPV Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${DAKEFPV_C3_Gemini.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${DAKEFPV_C3_Gemini.lib_deps}
  ${esp32_ota.lib_deps}
